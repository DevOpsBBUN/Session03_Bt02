server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/my-web/html;
    index index.html;

    # Định nghĩa trang lỗi 404
    error_page 404 /404.html;

    # Bảo vệ file lỗi bằng chỉ thị internal, ngăn truy cập trực tiếp
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
